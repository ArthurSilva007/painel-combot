<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>botIA - Canais</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6B35'%3E%3Cpath d='M12 2s5 5 5 10a5 5 0 0 1-10 0c0-1 .3-2 1-3 0 1.5 1 2.5 2 2.5S9 12 9 10c0-3 2-6 3-8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><i data-lucide="flame" class="logo-icon icon-lg"></i> bot<span>IA</span></div>
    <nav>
      <a href="dashboard.html"><i data-lucide="layout-dashboard" class="nav-icon"></i> Dashboard</a>
      <a href="publish.html"><i data-lucide="send" class="nav-icon"></i> Publicar Oferta</a>
      <a href="channels.html" class="active"><i data-lucide="radio-tower" class="nav-icon"></i> Canais</a>
      <a href="settings.html"><i data-lucide="settings" class="nav-icon"></i> Configurações</a>
      <a href="users.html" id="adminNav" style="display:none;"><i data-lucide="users" class="nav-icon"></i> Usuários</a>
    </nav>
    <div class="user-footer">
      <div class="user-footer-info">
        <div class="avatar" id="navUserInitial">C</div>
        <span id="navUserName">Cliente</span>
        <span class="badge-pro">PRO</span>
      </div>
      <span class="logout-btn" onclick="logout()" title="Sair"><i data-lucide="log-out" class="icon icon-sm"></i></span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><h1><i data-lucide="radio-tower" class="icon-lg"></i> Meus Canais</h1></div>
    <div style="max-width:600px;">
      <div id="channelsList"></div>

      <div class="card" style="margin-top:16px;cursor:pointer;" id="addChannelCard">
        <div style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--accent);font-weight:600;" id="addChannelBtn">
          <i data-lucide="circle-plus" class="icon"></i> Adicionar Canal
        </div>
        <div class="expand-form" id="newChannelForm">
          <form>
            <div class="form-group">
              <label>Tipo</label>
              <select id="newChannelType">
                <option value="TELEGRAM">Telegram</option>
                <option value="WHATSAPP">WhatsApp</option>
              </select>
            </div>
            <div class="form-group">
              <label>Chat ID / Group ID</label>
              <input type="text" id="newChatId" placeholder="-1001234567890 ou 120363...-group" required>
            </div>
            <div style="display:flex;gap:10px;">
              <button type="submit" class="btn">Salvar</button>
              <button type="button" class="btn btn-outline" id="cancelAddBtn">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/deployment.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/channels.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
