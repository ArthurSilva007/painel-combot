<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>botIA - Publicar Oferta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6B35'%3E%3Cpath d='M12 2s5 5 5 10a5 5 0 0 1-10 0c0-1 .3-2 1-3 0 1.5 1 2.5 2 2.5S9 12 9 10c0-3 2-6 3-8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><i data-lucide="flame" class="logo-icon icon-lg"></i> bot<span>IA</span></div>
    <nav>
      <a href="dashboard.html"><i data-lucide="layout-dashboard" class="nav-icon"></i> Dashboard</a>
      <a href="publish.html" class="active"><i data-lucide="send" class="nav-icon"></i> Publicar Oferta</a>
      <a href="channels.html"><i data-lucide="radio-tower" class="nav-icon"></i> Canais</a>
      <a href="settings.html"><i data-lucide="settings" class="nav-icon"></i> Configurações</a>
      <a href="users.html" id="adminNav" style="display:none;"><i data-lucide="users" class="nav-icon"></i> Usuários</a>
    </nav>
    <div class="user-footer">
      <div class="user-footer-info">
        <div class="avatar" id="navUserInitial">C</div>
        <span id="navUserName">Cliente</span>
        <span class="badge-pro">PRO</span>
      </div>
      <span class="logout-btn" onclick="logout()" title="Sair"><i data-lucide="log-out" class="icon icon-sm"></i></span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><h1><i data-lucide="send" class="icon-lg"></i> Publicar Oferta</h1></div>

    <div class="card" style="max-width:600px;">
      <form id="publishForm">
        <div class="form-group">
          <label>Nome do produto *</label>
          <input type="text" id="productName" placeholder="Ex: Smartphone Galaxy S24" required minlength="3">
        </div>
        <div class="form-group">
          <label>Link do produto *</label>
          <input type="url" id="productUrl" placeholder="https://s.click.aliexpress.com/..." required>
        </div>
        <div class="form-group">
          <label>URL da imagem</label>
          <input type="url" id="imgUrl" placeholder="https://...">
        </div>
        <img id="imgPreview" class="img-preview" alt="Preview da imagem">

        <div class="panels" style="margin-bottom:0;">
          <div class="form-group" style="margin-bottom:0;">
            <label>Preço atual *</label>
            <input type="number" id="price" placeholder="0.00" step="0.01" min="0.01" required>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label>Preço original</label>
            <input type="number" id="originalPrice" placeholder="0.00" step="0.01">
          </div>
        </div>

        <div class="form-group">
          <label>Marketplace</label>
          <select id="source">
            <option value="ALIEXPRESS">AliExpress</option>
            <option value="SHOPEE">Shopee</option>
            <option value="OUTRO">Outro</option>
          </select>
        </div>

        <button type="submit" class="btn btn-full" id="publishBtn">
          <i data-lucide="rocket" class="icon"></i>
          <span>Publicar Oferta</span>
          <span class="spinner"></span>
        </button>
      </form>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/publish.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
