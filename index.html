<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>botIA - Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6B35'%3E%3Cpath d='M12 2s5 5 5 10a5 5 0 0 1-10 0c0-1 .3-2 1-3 0 1.5 1 2.5 2 2.5S9 12 9 10c0-3 2-6 3-8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo"><i data-lucide="flame" class="logo-icon icon-lg"></i> <span>botIA</span></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <i data-lucide="mail" class="icon"></i>
          <input type="text" id="username" placeholder="Seu email ou usuario" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <div class="input-wrap">
          <i data-lucide="lock" class="icon"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>
      <div id="errorMsg" class="error-msg"><i data-lucide="circle-alert" class="icon icon-sm"></i><span></span></div>
      <button type="submit" class="btn btn-full" id="loginBtn">
        <span id="btnText">Entrar</span>
        <span class="spinner" id="btnSpinner"></span>
      </button>
    </form>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function() {
      lucide.createIcons();
      if (localStorage.getItem('token')) { window.location.href = 'dashboard.html'; return; }
      var form = document.getElementById('loginForm');
      var btn = document.getElementById('loginBtn');
      var btnText = document.getElementById('btnText');
      var spinner = document.getElementById('btnSpinner');
      var error = document.getElementById('errorMsg');
      var errorText = error.querySelector('span');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var u = document.getElementById('username').value.trim();
        var p = document.getElementById('password').value;
        if (!u || !p) return;
        btn.disabled = true; btnText.style.display = 'none'; spinner.classList.add('show'); error.classList.remove('show');
        try {
          await login(u, p);
          window.location.href = 'dashboard.html';
        } catch(err) {
          errorText.textContent = 'Email ou senha inválidos. Verifique e tente novamente.';
          error.classList.add('show');
        } finally {
          btn.disabled = false; btnText.style.display = ''; spinner.classList.remove('show');
        }
      });
    })();
  </script>
</body>
</html>
